<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Personal Budget</title>
<meta name="theme-color" content="#1f6f54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --ink:#1e1d1a; --muted:#77736b; --line:#e6e1d7;
  --accent:#1f6f54; --accent-soft:#e1efe8; --neg:#b2472b; --neg-soft:#f6e3dc; --warn:#b7801c; --warn-soft:#f6ecd7;
  --chip:#efebe3; --pos:#1f7a52; --c-inc:#1f7a52; --c-exp:#b2472b; --on-accent:#fff; --shadow:0 1px 2px rgba(30,29,26,.06),0 4px 16px rgba(30,29,26,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151513; --card:#1e1e1b; --ink:#efece6; --muted:#9a968d; --line:#2e2d29;
  --accent:#5dbb93; --accent-soft:#1f3329; --neg:#e7866a; --neg-soft:#3a2520; --warn:#e0b25a; --warn-soft:#3a3020;
  --chip:#2a2926; --pos:#5dbb93; --c-inc:#3fa57a; --c-exp:#d9714d; --on-accent:#fff; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
main{max-width:600px;margin:0 auto;padding:18px 16px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px;gap:10px}
header.top h1{font-size:26px;margin:0}
header.top .sub{color:var(--muted);font-size:13px}
.banner{background:var(--neg-soft);color:var(--neg);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 8px}
.amount-wrap .cur{font-size:34px;color:var(--muted)}
.amount-wrap input{width:100%;max-width:280px;border:0;background:transparent;font-family:Fraunces,Georgia,serif;font-size:50px;font-weight:500;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.amount-wrap input::placeholder{color:var(--line)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat{border:1.5px solid transparent;background:var(--chip);border-radius:12px;padding:9px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
.cat .e{font-size:20px;line-height:1}
.cat .n{font-size:11.5px;text-align:center;line-height:1.15}
.cat.on{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;flex:1;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;outline:none;min-height:42px}
.inp:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;cursor:pointer;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--on-accent);width:100%;margin-top:18px;font-size:16px}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.ghost{background:transparent;border:1.5px dashed var(--line);width:100%;color:var(--muted)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.it .ic{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.it .mid{flex:1;min-width:0}
.it .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .amt{font-weight:600;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)} .warn{color:var(--warn)}
.dayhead{font-size:12px;color:var(--muted);font-weight:600;margin:14px 4px 4px;display:flex;justify-content:space-between}
.dayhead.sel{color:var(--accent)}
.bar{height:7px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--neg)} .bar i.near{background:var(--warn)}
.mswitch{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.mswitch button{background:var(--card);border:1px solid var(--line);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.mswitch .m{font-size:20px}
.big{font-size:34px;line-height:1.1}
/* home boxes */
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.boxes{grid-template-columns:repeat(3,1fr)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:128px;box-shadow:var(--shadow);position:relative}
.box .e{font-size:26px;line-height:1;margin-bottom:6px}
.box .n{font-weight:600;font-size:14.5px}
.box .v{font-size:20px;margin-top:auto}
.box .b{font-size:12px;color:var(--muted)}
.box.over{border-color:var(--neg);background:linear-gradient(var(--neg-soft),var(--card) 70%)}
.box.near{border-color:var(--warn)}
.box.editing{border-style:dashed}
.box .plus{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:99px;background:var(--chip);display:grid;place-items:center;color:var(--muted);font-size:17px}
.box.add{border:1.5px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.box.add .e{font-size:28px;margin:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.near{background:var(--warn-soft);color:var(--warn)} .tag.over{background:var(--neg-soft);color:var(--neg)} .tag.none{background:var(--chip);color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{border:0;background:transparent;border-radius:10px;padding:6px 0 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.cal .d .dn{font-size:14px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:99px}
.cal .d .ds{font-size:9.5px;font-weight:600;color:var(--neg);line-height:1.1}
.cal .d .di{font-size:9.5px;font-weight:600;color:var(--accent);line-height:1.1}
.cal .d.today .dn{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.cal .d.sel{background:var(--accent-soft)}
.cal .d.sel .dn{background:var(--accent);color:var(--on-accent);box-shadow:none}
.cal .d.future{opacity:.45}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totals .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:19px;margin-top:2px}
/* budget */
.brow{padding:12px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .top{display:flex;align-items:center;gap:10px}
.brow .nm{flex:1;min-width:0;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer}
.brow .bin{width:110px;text-align:right;padding:8px 10px;min-height:38px}
.brow .meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:600px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;min-width:0;white-space:nowrap}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
#sheet .panel{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
#sheet .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#sheet .ph h3{margin:0;font-size:20px}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:99px;cursor:pointer;font-size:15px;flex:none}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;display:flex;gap:14px;align-items:center;z-index:20;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;filter:brightness(1.4)}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:99px;animation:sp 1s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.emo-pick button{border:1.5px solid transparent;background:var(--chip);border-radius:10px;width:40px;height:40px;font-size:19px;cursor:pointer}
.emo-pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px;padding:0;text-transform:none;letter-spacing:0}
textarea.inp{min-height:160px;font-family:ui-monospace,monospace;font-size:12px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.goal .gh{display:flex;gap:12px;align-items:center;cursor:pointer}
.goal .ge{width:46px;height:46px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:24px;flex:none}
.goal .bar{height:10px;margin-top:12px}
.goal .gm{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:8px}
.goal .acts{display:flex;gap:8px;margin-top:12px}
.goal .acts .btn{flex:1}
.goal.done{border-color:var(--accent)}
.ring{--p:0;width:64px;height:64px;border-radius:99px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--chip) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:99px;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700}
.nbreak{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.nbreak b{display:block;color:var(--ink);font-size:15px;margin-top:1px}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px;vertical-align:1px}
.toggle{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.sw{border:2px solid transparent;border-radius:14px;padding:8px 4px;background:var(--chip);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sw i{width:34px;height:34px;border-radius:99px;display:block;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.sw.on{border-color:var(--ink)}
.sw input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:99px;cursor:pointer}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;width:36px;height:36px;font-size:17px;cursor:pointer;display:grid;place-items:center}
.yr svg{display:block;width:100%;height:auto;overflow:visible}
.yr .lg{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.yr .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.yr .readout{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:13px}
.yr .readout .rv{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.yr .readout .rv span{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.yr .readout b{font-size:14px}
.yr .hit{cursor:pointer}
.sw2{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.yr details{margin-top:10px;font-size:13px}
.yr summary{color:var(--muted);cursor:pointer;font-weight:600}
.yr table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.yr td,.yr th{padding:5px 2px;text-align:right;border-top:1px solid var(--line)}
.yr th{font-weight:600;color:var(--muted);font-size:11.5px;border-top:0}
.yr td:first-child,.yr th:first-child{text-align:left}
.ysum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.ysum b{display:block;color:var(--ink);font-size:13.5px;text-transform:none;letter-spacing:0;margin-top:1px}
.ab{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px}
.ab div{display:flex;justify-content:space-between}
.ab span{color:var(--muted)}
.env{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;
  background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px));
  background-size:50% 46px;background-position:left bottom,right bottom;background-repeat:no-repeat}
.env .flap{position:absolute;left:-1px;right:-1px;top:-1px;height:58px;background:var(--accent-soft);clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:none}
.env .flap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.06));}
.env .seal{position:absolute;left:50%;top:44px;width:24px;height:24px;margin-left:-12px;border-radius:99px;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 0 0 3px rgba(255,255,255,.18)}
.env.done .seal{background:var(--pos)}
.env .stamp{position:absolute;top:12px;right:12px;width:50px;height:58px;background:var(--card);border:2px dashed var(--line);border-radius:4px;display:grid;place-items:center;font-size:28px;transform:rotate(4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.env .body{position:relative;padding:76px 16px 14px;cursor:pointer}
.env .to{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.env .nm{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:500;line-height:1.15;margin-top:2px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-right:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.env .amt{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.env .amt b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px}
.env .bar{height:8px;margin-top:8px}
.env .acts{display:flex;gap:8px;padding:0 16px 16px;position:relative}
.env .acts .btn{flex:1}
.alrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.alrow:first-child{border-top:0}
.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tpl button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:500}
.tpl button span{font-size:22px}
</style>
</head>
<body>
<main id="app"><div class="spin"></div></main>
<nav class="tabs" id="tabs" style="display:none"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Home</button>
  <button data-tab="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M19 10v8M9.5 10v8M14.5 10v8M3 20h18"/></svg>Net Assets</button>
  <button data-tab="transactions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Transactions</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Budget</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Goals</button>
</div></nav>
<div id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script>
/* ---------- constants ---------- */
const ASSET_TYPES = {checking:['Checking','🏦'],mm:['Money market','💵'],savings:['Savings','🐖'],hysa:['High-yield savings','🌱'],brokerage:['Brokerage','📈'],retirement:['Retirement','🪺'],property:['Home value','🏡'],vehicle:['Vehicle','🚗'],cash:['Cash','👛'],otherAsset:['Other asset','💎']};
const LIAB_TYPES = {mortgage:['Mortgage','🏠'],credit:['Credit card','💳'],auto:['Auto loan','🚙'],student:['Student loan','🎓'],loan:['Other loan','🧾']};
const TYPE = {...ASSET_TYPES,...LIAB_TYPES};
const DEFAULT_CATS = [
  ['Household','🏠','expense'],['Groceries','🛒','expense'],['Utilities','💡','expense'],['Health','💊','expense'],

const NEAR = 0.8;

/* ---------- appearance ---------- */
const THEMES=[['green','Green','#1f6f54'],['pink','Pink','#d63c7a'],['rose','Rose','#c2557a'],['blue','Blue','#2563c9'],['purple','Purple','#7a4fd1'],['orange','Orange','#d4622a'],['teal','Teal','#0f8a80'],['slate','Slate','#4a5568']];
const hexToRgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]};
const rgbToHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,w)=>{const x=hexToRgb(a),y=hexToRgb(b);return rgbToHex(x.map((v,i)=>v*(1-w)+y[i]*w))};
const lum=h=>{const [r,g,b]=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
function palette(hex,dark){
  if(dark){
    let acc=hex;while(lum(acc)<.22)acc=mix(acc,'#ffffff',.18);
    return {bg:mix(hex,'#121212',.9),card:mix(hex,'#1b1b1b',.88),ink:mix(hex,'#f3f1ee',.9),muted:mix(hex,'#9c9a96',.8),line:mix(hex,'#2c2c2c',.82),
      chip:mix(hex,'#262626',.84),accent:acc,'accent-soft':mix(hex,'#1b1b1b',.74),'on-accent':lum(acc)>.45?'#141414':'#ffffff'};
  }
  let acc=hex;while(lum(acc)>.3)acc=mix(acc,'#000000',.15);
  return {bg:mix(hex,'#ffffff',.9),card:mix(hex,'#ffffff',.975),ink:mix(hex,'#1c1b1a',.86),muted:mix(hex,'#717070',.78),line:mix(hex,'#ffffff',.8),
    chip:mix(hex,'#ffffff',.86),accent:acc,'accent-soft':mix(hex,'#ffffff',.82),'on-accent':'#ffffff'};
}
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function currentAppearance(){
  let a=S&&S.settings&&S.settings.appearance;
  if(!a){try{a=JSON.parse(localStorage.getItem('ledger_appearance')||'null')}catch(e){}}
  return Object.assign({theme:'green',mode:'auto',custom:'#e05a9c'},a||{});
}
function applyAppearance(a){
  a=a||currentAppearance();
  const dark=a.mode==='dark'||(a.mode==='auto'&&darkMQ&&darkMQ.matches);
  const root=document.documentElement.style;
  const keys=['bg','card','ink','muted','line','chip','accent','accent-soft','on-accent'];
  if(a.theme==='green'){keys.forEach(k=>root.removeProperty('--'+k));document.documentElement.style.colorScheme=a.mode==='auto'?'':(dark?'dark':'light');
    // classic palette lives in the stylesheet; force light/dark when not on auto
    if(a.mode!=='auto'){const p=dark?{bg:'#151513',card:'#1e1e1b',ink:'#efece6',muted:'#9a968d',line:'#2e2d29',chip:'#2a2926',accent:'#5dbb93','accent-soft':'#1f3329','on-accent':'#fff'}
      :{bg:'#f5f2ec',card:'#fffdf9',ink:'#1e1d1a',muted:'#77736b',line:'#e6e1d7',chip:'#efebe3',accent:'#1f6f54','accent-soft':'#e1efe8','on-accent':'#fff'};keys.forEach(k=>root.setProperty('--'+k,p[k]))}
  }else{
    const hex=a.theme==='custom'?a.custom:(THEMES.find(t=>t[0]===a.theme)||THEMES[0])[2];
    const p=palette(hex,dark);keys.forEach(k=>root.setProperty('--'+k,p[k]));
  }
  // semantic colors follow light/dark
  const sem=dark?{neg:'#e7866a','neg-soft':'#3a2520',warn:'#e0b25a','warn-soft':'#3a3020',pos:'#5dbb93','c-inc':'#3fa57a','c-exp':'#d9714d',shadow:'none'}
    :{neg:'#b2472b','neg-soft':'#f6e3dc',warn:'#b7801c','warn-soft':'#f6ecd7',pos:'#1f7a52','c-inc':'#1f7a52','c-exp':'#b2472b',shadow:'0 1px 2px rgba(30,29,26,.06),0 4px 16px rgba(30,29,26,.05)'};
  if(a.mode==='auto'&&a.theme==='green')Object.keys(sem).forEach(k=>root.removeProperty('--'+k));else Object.entries(sem).forEach(([k,v])=>root.setProperty('--'+k,v));
  document.documentElement.style.colorScheme=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f5f2ec');
}
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',()=>applyAppearance());

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUSD = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money = n=>fmtUSD.format(Math.round((+n||0)*100)/100);
const moneyTiny = n=>{n=+n||0;return n>=10000?'$'+Math.round(n/1000)+'k':n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n)};
const genId = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const ymd = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = ()=>ymd(new Date());
const yesterday = ()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d)};
const mkey = d=>d.slice(0,7);
const curMonth = ()=>today().slice(0,7);
const monthLabel = k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const shiftMonth = (k,n)=>{const[y,m]=k.split('-').map(Number);return ymd(new Date(y,m-1+n,1)).slice(0,7)};
const dayLabel = (d,long)=>{if(!long){if(d===today())return 'Today';if(d===yesterday())return 'Yesterday'}const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const parseAmt = s=>{const n=parseFloat(String(s).replace(/[^0-9.\-]/g,''));return isFinite(n)?Math.round(n*100)/100:NaN};
const clone = o=>JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
const S = {settings:null, months:{}, mode:'loading', settingsConfirmed:false, stale:false, readOnly:false,
  tab:'home', viewMonth:curMonth(), selDay:today()};
let db=null, uid=null, settingsRef=null, monthsCol=null;
try{applyAppearance()}catch(e){}
const pending={}; let pendingSettings=0; const queues={};

const accounts = ()=>(S.settings?.accounts||[]).filter(a=>!a.archived);
const acctById = id=>(S.settings?.accounts||[]).find(a=>a.id===id);
const cats = (kind,all)=>(S.settings?.categories||[]).filter(c=>(!kind||c.kind===kind)&&(all||!c.hidden));
const catById = id=>(S.settings?.categories||[]).find(c=>c.id===id);
const isLiab = a=>a&&a.type in LIAB_TYPES;
const CASH_TYPES=['checking','savings','mm','hysa','cash'];
const isCash = a=>!!a&&!isLiab(a)&&(typeof a.cash==='boolean'?a.cash:CASH_TYPES.includes(a.type));
const allTx = ()=>Object.values(S.months).flat();

/* ---------- persistence ---------- */
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn);queues[key]=p.catch(()=>{});return p}
function dbErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){S.readOnly=true;render();return "This view can't save changes."}
  if(c==='quota_exceeded')return 'Storage is full — export and remove old entries.';
  if(c==='revoked')return 'Access to saved data ended for this view.';
  return "Couldn't save — check your connection and try again.";
}
function saveSettings(){
  if(S.mode==='local')return saveLocal();
  if(S.mode!=='cloud')return;
  pendingSettings++;const body=clone(S.settings);
  enqueue('settings',()=>settingsRef.set(body)).catch(e=>toast(dbErr(e))).finally(()=>pendingSettings--);
}
function saveMonth(k){
  if(S.mode==='local')return saveLocal();
  if(S.mode!=='cloud')return;
  pending[k]=(pending[k]||0)+1;
  enqueue('m'+k,()=>{const items=S.months[k]||[];const ref=monthsCol.doc(k);return items.length?ref.set({items:clone(items)}):ref.delete()})
    .catch(e=>toast(dbErr(e))).finally(()=>{pending[k]--});
}
const LS_KEY='ledger_data_v1';
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({settings:S.settings,months:S.months,savedAt:Date.now()}))}
  catch(e){toast("Couldn't save on this device — make a backup.")}
}
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);localStorage.setItem('__t','1');localStorage.removeItem('__t');
    if(raw){const d=JSON.parse(raw);S.settings=d.settings||null;S.months=d.months||{}}return true}
  catch(e){return false}
}
function defaultSettings(){return {accounts:[],categories:DEFAULT_CATS.map(([name,emo,kind])=>({id:genId(),name,emo,kind,budget:0})),createdAt:Date.now()}}
function ensureSettings(){
  if(!S.settings&&S.settingsConfirmed&&!(S.stale&&S.mode==='cloud')){S.settings=defaultSettings();saveSettings()}
  // migrate v1 accounts (opening + transactions) to manual balances
  if(S.settings&&S.settings.accounts.some(a=>a.balance===undefined)){
    const lb=legacyBalances();
    S.settings.accounts=S.settings.accounts.map(a=>a.balance===undefined?{...a,balance:lb[a.id]??(+a.opening||0),updated:today()}:a);
    saveSettings();
  }
}
function legacyBalances(){
  const bal={};(S.settings?.accounts||[]).forEach(a=>bal[a.id]=+a.opening||0);
  const ap=(id,d)=>{if(id in bal)bal[id]+=isLiab(acctById(id))?-d:d};
  allTx().slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)).forEach(t=>{
    if(t.kind==='expense')ap(t.acct,-t.amount);else if(t.kind==='income')ap(t.acct,t.amount);
    else if(t.kind==='transfer'){ap(t.acct,-t.amount);ap(t.to,t.amount)}else if(t.kind==='adjust'&&t.acct in bal)bal[t.acct]=t.amount;
  });
  return bal;
}
async function init(){
  const timer=setTimeout(()=>{if(!S.settingsConfirmed){S.stale=true;render()}},10000);
  try{
    if(!window.claude||typeof window.claude.use!=='function')throw 0;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u)throw 0;
    uid=await u.id();if(!uid)throw 0;
    db=d;S.mode='cloud';
    settingsRef=db.doc('data/users/'+uid+'/settings');
    monthsCol=db.doc('data/users/'+uid+'/ledger').collection('months');
    let monthsIn=false;
    settingsRef.onSnapshot(snap=>{
      if(pendingSettings<=0)S.settings=snap.exists?clone(snap.data()):null;
      if(!snap.metadata.fromCache){S.settingsConfirmed=true;S.stale=false;clearTimeout(timer)}
      else if(snap.exists)S.settingsConfirmed=true;
      if(monthsIn)ensureSettings();
      refresh();
    },e=>{clearTimeout(timer);S.stale=true;S.settingsConfirmed=true;refresh()});
    monthsCol.onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=clone(d.data().items||[])});
      for(const k in pending)if(pending[k]>0)next[k]=S.months[k]||[];
      S.months=next;monthsIn=true;ensureSettings();refresh();
    },e=>{S.stale=true;refresh()});
  }catch(e){
    clearTimeout(timer);
    if(loadLocal()){S.mode='local';try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}}
    else S.mode='memory';
    S.settingsConfirmed=true;ensureSettings();render();
  }
}

/* ---------- tx ops ---------- */
// Expenses, income and transfers that name an account move that account's balance.
function acctDelta(id,assetDelta){
  const a=(S.settings?.accounts||[]).find(x=>x.id===id);if(!a||!assetDelta)return false;
  a.balance=Math.round(((+a.balance||0)+(isLiab(a)?-assetDelta:assetDelta))*100)/100;a.updated=today();return true;
}
function applyEffect(t,sign){
  if(!t||!S.settings)return false;
  if(t.kind==='expense')return acctDelta(t.acct,-t.amount*sign);
  if(t.kind==='income')return acctDelta(t.acct,t.amount*sign);
  if(t.kind==='transfer'){const a=acctDelta(t.acct,-t.amount*sign),b=acctDelta(t.to,t.amount*sign);return a||b}
  return false;
}
function addTx(t){t.id=genId();t.created=Date.now();const k=mkey(t.date);(S.months[k]=S.months[k]||[]).push(t);saveMonth(k);if(applyEffect(t,1))saveSettings();return t}
function removeTx(t){const k=mkey(t.date);S.months[k]=(S.months[k]||[]).filter(x=>x.id!==t.id);saveMonth(k);if(applyEffect(t,-1))saveSettings()}
function restoreTx(t){const k=mkey(t.date);(S.months[k]=S.months[k]||[]).push(t);saveMonth(k);if(applyEffect(t,1))saveSettings()}
function updateTx(old,nt){const ko=mkey(old.date),kn=mkey(nt.date);S.months[ko]=(S.months[ko]||[]).filter(x=>x.id!==old.id);(S.months[kn]=S.months[kn]||[]).push(nt);saveMonth(ko);if(kn!==ko)saveMonth(kn);
  const a=applyEffect(old,-1),b=applyEffect(nt,1);if(a||b)saveSettings()}
function lastAcct(kind){
  let v=null;try{v=localStorage.getItem('ledger_lastAcct_'+kind)}catch(e){}
  if(v!==null&&(v===''||accounts().some(a=>a.id===v)))return v;
  const pick=kind==='expense'?accounts().find(a=>a.type==='credit'):accounts().find(a=>['checking','savings','mm','hysa'].includes(a.type));
  return pick?pick.id:'';
}
function rememberAcct(kind,id){try{localStorage.setItem('ledger_lastAcct_'+kind,id||'')}catch(e){}}
function acctSelect(id,sel,blank){
  const list=accounts().slice();const cur=acctById(sel);if(cur&&!list.includes(cur))list.push(cur);
  return `<select class="inp" id="${id}">${blank?`<option value="">${blank}</option>`:''}${list.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${TYPE[a.type]?.[1]||''} ${esc(a.name)}</option>`).join('')}</select>`;
}

/* ---------- calculations ---------- */
function monthSummary(k){
  const items=(S.months[k]||[]).filter(t=>t.kind==='expense'||t.kind==='income');let spent=0,income=0;const byCat={},byDay={};
  for(const t of items){
    const d=byDay[t.date]=byDay[t.date]||{s:0,i:0};
    if(t.kind==='expense'){spent+=t.amount;byCat[t.cat]=(byCat[t.cat]||0)+t.amount;d.s+=t.amount}
    else{income+=t.amount;d.i+=t.amount}
  }
  return {spent,income,byCat,byDay,items};
}
function status(spent,budget){if(!budget)return 'none';const r=spent/budget;return r>1?'over':r>=NEAR?'near':'ok'}
const statusText={ok:'On track',near:'Near budget',over:'Over budget',none:'No budget'};
const totalBudget=()=>cats('expense').reduce((s,c)=>s+(+c.budget||0),0);

/* ---------- shell ---------- */
function banners(){
  let h='';
  if(S.mode==='memory')h+='<div class="banner">Saving is off in this view — entries will disappear when you close it. Your browser is blocking storage (private browsing?).</div>';
  if(S.stale)h+='<div class="banner">Can\'t reach your saved data right now. What you see may be out of date.</div>';
  if(S.readOnly)h+='<div class="banner">This view can\'t save changes.</div>';
  return h;
}
function refresh(){if($('#sheet').classList.contains('open'))return;render()}
function render(){

const TABS=['home','assets','transactions','budget','goals'];
function setTab(t){S.tab=t;if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)}
$$('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function header(title,sub){return `<header class="top"><h1 class="serif">${title}</h1><span class="sub">${sub||''}</span></header>`}

let toastT;
function toast(msg,actLabel,act){
  $('#toastMsg').textContent=msg;const b=$('#toastAct');
  b.style.display=actLabel?'':'none';b.textContent=actLabel||'';b.onclick=()=>{$('#toast').classList.remove('show');act&&act()};
  $('#toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('show'),actLabel?5000:3000);

/* ---------- entry sheet (add / edit transaction) ---------- */
function openEntrySheet({kind='expense',cat=null,date=today(),tx=null}={}){
  const f=tx?{kind:tx.kind==='income'?'income':'expense',amount:String(tx.amount),date:tx.date,cat:tx.cat||null,note:tx.note||'',acct:tx.acct||''}:{kind,amount:'',date,cat,note:'',acct:lastAcct(kind)};
  const fixedCat=!tx&&cat;
  const draw=p=>{
    const c=catById(f.cat);
    const list=cats(f.kind);if(c&&c.hidden&&c.kind===f.kind)list.push(c);
    $('#entryBody',p).innerHTML=`
      ${fixedCat?'':`<div class="seg"><button type="button" data-kind="expense" class="${f.kind==='expense'?'on':''}">Expense</button><button type="button" data-kind="income" class="${f.kind==='income'?'on':''}">Income</button></div>`}
      <div class="amount-wrap"><span class="cur serif">$</span><input id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(f.amount)}" aria-label="Amount"></div>
      <div id="budgetNote" class="hint" style="text-align:center;min-height:18px;margin:-2px 0 10px"></div>
      ${fixedCat?'':`<div class="cats">${list.map(x=>`<button type="button" class="cat ${x.id===f.cat?'on':''}" data-cat="${x.id}"><span class="e">${esc(x.emo)}</span><span class="n">${esc(x.name)}</span></button>`).join('')}</div>`}
      ${accounts().length?`<label class="field"><span>${f.kind==='income'?'Deposited to':'Paid with'}</span>${acctSelect('fAcct',f.acct,"Don't update an account")}</label><div id="acctNote" class="hint"></div>`
        :'<p class="hint">Tip: add your accounts on Net Assets and their balances will update as you enter expenses.</p>'}
      <label class="field"><span>Date</span><input type="date" class="inp" id="fDate" value="${f.date}"></label>
      <label class="field"><span>Note (optional)</span><input class="inp" id="fNote" value="${esc(f.note)}" placeholder="e.g. Costco run"></label>
      <button type="button" class="btn primary" id="fSave">${tx?'Save changes':'Add '+f.kind}</button>
      ${tx?'<button type="button" class="btn danger" id="fDel" style="width:100%;margin-top:10px">Delete</button>':''}`;
    const amtEl=$('#fAmt',p);
    const note=()=>{
      const cc=catById(f.cat);const el=$('#budgetNote',p);
      if(f.kind!=='expense'||!cc||!cc.budget){el.innerHTML='';return}
      const k=mkey(f.date||today());let spent=monthSummary(k).byCat[cc.id]||0;if(tx&&tx.kind==='expense'&&tx.cat===cc.id&&mkey(tx.date)===k)spent-=tx.amount;
      const a=parseAmt(amtEl.value);const after=spent+(a>0?a:0);const st=status(after,cc.budget);
      el.innerHTML=`${esc(cc.name)}: ${money(after)} of ${money(cc.budget)} ${a>0?'after this':'so far'} · <span class="tag ${st}">${statusText[st]}</span>`;
    };
    const acctNote=()=>{
      const el=$('#acctNote',p);if(!el)return;const a=acctById(f.acct);if(!a){el.innerHTML='';return}
      let bal=+a.balance||0;
      if(tx&&tx.acct===a.id){const od=tx.kind==='income'?tx.amount:-tx.amount;bal-=isLiab(a)?-od:od}
      const v=parseAmt(amtEl.value),d=v>0?(f.kind==='income'?v:-v):0,nb=bal+(isLiab(a)?-d:d);
      el.innerHTML=`${esc(a.name)} ${isLiab(a)?'owed':'balance'}: ${money(bal)}${v>0?` → <b class="num">${money(nb)}</b>`:''}`;
    };
    note();acctNote();
    const fa=$('#fAcct',p);if(fa)fa.onchange=()=>{f.acct=fa.value;acctNote()};
    amtEl.addEventListener('input',()=>{f.amount=amtEl.value;note();acctNote()});
    amtEl.addEventListener('keydown',e=>{if(e.key==='Enter')$('#fSave',p).click()});
    $('#fDate',p).addEventListener('input',e=>{f.date=e.target.value;note()});
    $('#fNote',p).addEventListener('input',e=>f.note=e.target.value);
    $$('[data-kind]',p).forEach(b=>b.onclick=()=>{if(f.kind===b.dataset.kind)return;f.kind=b.dataset.kind;f.cat=null;if(!tx)f.acct=lastAcct(f.kind);f.amount=amtEl.value;draw(p)});
    $$('[data-cat]',p).forEach(b=>b.onclick=()=>{f.cat=b.dataset.cat;$$('[data-cat]',p).forEach(x=>x.classList.toggle('on',x===b));note()});
    $('#fSave',p).onclick=()=>{
      const amt=parseAmt(amtEl.value);
      if(!(amt>0))return toast('Enter an amount');
      if(!f.cat)return toast('Pick a type');
      if(!f.date)return toast('Pick a date');
      const t={kind:f.kind,amount:amt,date:f.date,cat:f.cat,note:(f.note||'').trim()};
      if(f.acct&&acctById(f.acct))t.acct=f.acct;
      if(!tx)rememberAcct(f.kind,f.acct);
      if(tx){t.id=tx.id;t.created=tx.created;updateTx(tx,t);closeSheet();toast('Saved');return}
      const saved=addTx(t);closeSheet();
      const cc=catById(t.cat);let msg=`Added ${money(t.amount)} · ${cc?.name||''}`;
      if(t.kind==='expense'&&cc?.budget){const sp=monthSummary(mkey(t.date)).byCat[cc.id]||0;const st=status(sp,cc.budget);
        msg=st==='over'?`${cc.name} is ${money(sp-cc.budget)} over budget`:st==='near'?`${cc.name}: ${money(cc.budget-sp)} left — near budget`:`${cc.name}: ${money(cc.budget-sp)} left this month`}
      const ia=acctById(t.acct);
      if(t.kind==='income'&&ia&&isCash(ia)){toast(`${money(t.amount)} added to Ready to allocate`,'Allocate',()=>{setTab('goals');openAllocateSheet()});return}
      toast(msg,'Undo',()=>{removeTx(saved);render()});
    };
    const del=$('#fDel',p);if(del){let armed=false;del.onclick=()=>{if(!armed){armed=true;del.textContent='Tap again to delete';return}removeTx(tx);closeSheet();toast('Deleted','Undo',()=>{restoreTx(tx);render()})}}
    if(!tx)setTimeout(()=>amtEl.focus(),50);
  };
  const c=catById(f.cat);
  const title=tx?'Edit entry':fixedCat?`${esc(c.emo)} ${esc(c.name)}`:(f.kind==='income'?'Add income':'Add expense');
  openSheet(title,'<div id="entryBody"></div>',draw);
}

function openAcctSheet(a,liab){

    <label class="field"><span>${liab?'Amount owed':'Balance'}</span><input class="inp num" id="aBal" inputmode="decimal" value="${isNew?'':a.balance}" placeholder="0.00" style="font-size:22px"></label>

    <label class="field"><span>Type</span><select class="inp" id="aType">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${a.type===k?'selected':''}>${v[1]} ${v[0]}</option>`).join('')}</select></label>

    ${!isNew?'<button class="btn danger" id="aDel" style="width:100%;margin-top:10px">Delete account</button>':''}`,p=>{
    const cb=$('#aCash',p);let touched=false;

      const b=parseAmt($('#aBal',p).value);

      const nb=isFinite(b)?Math.abs(b):0;if(isNew||nb!==a.balance)a.updated=today();a.balance=nb;
      if(isNew)S.settings.accounts.push(a);else S.settings.accounts=S.settings.accounts.map(x=>x.id===a.id?a:x);

function lastBackup(){try{const v=localStorage.getItem('ledger_last_backup');return v?dayLabel(v):''}catch(e){return ''}}
function doBackup(){
  const data=JSON.stringify({app:'ledger',version:1,exportedAt:new Date().toISOString(),settings:S.settings,months:S.months},null,1);
  const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`ledger-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  try{localStorage.setItem('ledger_last_backup',today())}catch(e){}
  toast('Backup saved');setTimeout(render,300);
}
function doRestore(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){return toast("That file isn't a Ledger backup")}
    if(!d||d.app!=='ledger'||!d.settings)return toast("That file isn't a Ledger backup");
    const n=Object.values(d.months||{}).reduce((s,a)=>s+a.length,0);
    openSheet('Restore backup',`<p>This backup from <b>${esc((d.exportedAt||'').slice(0,10))}</b> has ${n} transactions, ${(d.settings.accounts||[]).length} accounts and ${(d.settings.goals||[]).length} goals.</p><p class="hint">It will replace everything currently in the app on this device.</p><button class="btn primary" id="doRes">Replace with backup</button>`,p=>{
      $('#doRes',p).onclick=()=>{S.settings=d.settings;S.months=d.months||{};saveLocal();closeSheet();toast('Backup restored')};
    });
  };
  r.readAsText(file);
}
function openTransferSheet(tx){
  const card=accounts().find(a=>a.type==='credit');
  const bank=accounts().find(a=>['checking','savings','mm','hysa'].includes(a.type))||accounts().find(a=>!isLiab(a));
  const f=tx?{amount:String(tx.amount),from:tx.acct||'',to:tx.to||'',date:tx.date,note:tx.note||''}
    :{amount:'',from:bank?.id||'',to:(card&&card.id!==bank?.id?card.id:accounts().find(a=>a.id!==bank?.id)?.id)||'',date:today(),note:''};
  openSheet(tx?'Edit transfer':'Pay card / Transfer',`
    <div class="amount-wrap"><span class="cur serif">$</span><input id="tAmt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(f.amount)}" aria-label="Amount"></div>
    <div class="row"><label class="field"><span>From</span>${acctSelect('tFrom',f.from)}</label><label class="field"><span>To</span>${acctSelect('tTo',f.to)}</label></div>
    <div id="tNote" class="hint"></div>
    <label class="field"><span>Date</span><input type="date" class="inp" id="tDate" value="${f.date}"></label>
    <label class="field"><span>Note (optional)</span><input class="inp" id="tMemo" value="${esc(f.note)}" placeholder="e.g. October statement"></label>
    <p class="hint">Transfers move money between your accounts. They don't count as spending, since the purchases were already entered.</p>
    <button class="btn primary" id="tSave">${tx?'Save changes':'Record transfer'}</button>
    ${tx?'<button class="btn danger" id="tDel" style="width:100%;margin-top:10px">Delete</button>':''}`,p=>{
    const amt=$('#tAmt',p);
    const preview=()=>{
      const v=parseAmt(amt.value),from=acctById($('#tFrom',p).value),to=acctById($('#tTo',p).value);
      if(!from||!to||from===to){$('#tNote',p).innerHTML=from&&from===to?'<span class="neg">Pick two different accounts.</span>':'';return}
      const line=(a,assetDelta)=>{let bal=+a.balance||0;
        if(tx){if(tx.acct===a.id)bal+=isLiab(a)?-tx.amount:tx.amount;if(tx.to===a.id)bal+=isLiab(a)?tx.amount:-tx.amount}
        const nb=bal+(isLiab(a)?-assetDelta:assetDelta);return `${esc(a.name)}: ${money(bal)}${v>0?` → <b class="num">${money(nb)}</b>`:''}`};
      $('#tNote',p).innerHTML=line(from,-(v>0?v:0))+'<br>'+line(to,v>0?v:0);
    };
    preview();amt.addEventListener('input',preview);$('#tFrom',p).onchange=preview;$('#tTo',p).onchange=preview;
    $('#tSave',p).onclick=()=>{
      const v=parseAmt(amt.value),from=$('#tFrom',p).value,to=$('#tTo',p).value,date=$('#tDate',p).value;
      if(!(v>0))return toast('Enter an amount');
      if(!from||!to||from===to)return toast('Pick two different accounts');
      if(!date)return toast('Pick a date');
      const t={kind:'transfer',amount:v,acct:from,to,date,note:$('#tMemo',p).value.trim()};
      if(tx){t.id=tx.id;t.created=tx.created;updateTx(tx,t);closeSheet();toast('Saved');return}
      const saved=addTx(t);closeSheet();
      const b=acctById(to);toast(isLiab(b)?`Paid ${money(v)} to ${b.name}`:`Moved ${money(v)} to ${b.name}`,'Undo',()=>{removeTx(saved);render()});
    };
    const d=$('#tDel',p);if(d){let armed=false;d.onclick=()=>{if(!armed){armed=true;d.textContent='Tap again to delete';return}removeTx(tx);closeSheet();toast('Deleted','Undo',()=>{restoreTx(tx);render()})}}
    if(!tx)setTimeout(()=>amt.focus(),50);
  });
}

function openExport(){
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=allTx().filter(t=>['expense','income','transfer'].includes(t.kind)).sort((a,b)=>a.date<b.date?-1:1).map(t=>[t.date,t.kind,catById(t.cat)?.name||'',acctById(t.acct)?.name||'',acctById(t.to)?.name||'',t.kind==='expense'?-t.amount:t.amount,t.note||''].map(q).join(','));
  const csv=['date,kind,type,account,to_account,amount,note',...rows].join('\n');
  openSheet('Export',`<p class="hint">${rows.length} entries. Paste into Excel, Google Sheets or Numbers.</p><textarea class="inp" id="csv" readonly>${esc(csv)}</textarea><button class="btn primary" id="cp">Copy CSV</button>`,p=>{
    $('#cp',p).onclick=async()=>{try{await navigator.clipboard.writeText(csv);toast('Copied')}catch(e){$('#csv',p).select();toast('Select all and copy')}};
  });
}

/* ---------- TRANSACTIONS ---------- */
function monthSwitch(){return `<div class="mswitch"><button id="mPrev" aria-label="Previous month">‹</button><span class="m serif">${monthLabel(S.viewMonth)}</span><button id="mNext" aria-label="Next month">›</button></div>`}
function bindMonthSwitch(onChange){
  $('#mPrev').onclick=()=>{S.viewMonth=shiftMonth(S.viewMonth,-1);onChange&&onChange();render()};
  $('#mNext').onclick=()=>{S.viewMonth=shiftMonth(S.viewMonth,1);onChange&&onChange();render()};
}
function syncSelDay(){const k=S.viewMonth;S.selDay=k===curMonth()?today():k+'-01'}
function txRow(t){
  if(t.kind==='transfer'){
    const a=acctById(t.acct),b=acctById(t.to);
    const title=b?(isLiab(b)?`Paid ${b.name}`:`Transfer to ${b.name}`):'Transfer';
    const sub=[a?'from '+a.name:'',t.note].filter(Boolean).join(' · ');
    return `<div class="it" data-tx="${t.id}"><div class="ic">⇄</div><div class="mid"><div class="t">${esc(title)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div><div class="amt num mut">${money(t.amount)}</div></div>`;
  }
  const c=catById(t.cat),a=acctById(t.acct);
  const sub=[t.note,a?a.name:''].filter(Boolean).join(' · ');
  return `<div class="it" data-tx="${t.id}"><div class="ic">${esc(c?.emo||'•')}</div><div class="mid"><div class="t">${esc(c?.name||'Uncategorized')}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div><div class="amt num ${t.kind==='income'?'pos':''}">${t.kind==='income'?'+':'−'}${money(t.amount)}</div></div>`;
}
function openTxItem(t){if(!t)return;if(t.kind==='transfer')openTransferSheet(t);else if(t.kind==='expense'||t.kind==='income')openEntrySheet({tx:t})}

/* ---------- 12-month chart ---------- */
let yrSel=null;
function yearData(){
  const end=curMonth();
  return [...Array(12)].map((_,i)=>{const k=shiftMonth(end,i-11),m=monthSummary(k);return {k,inc:m.income,exp:m.spent}});
}
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function topBar(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,h,w/2);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function yearChartHTML(){
  const d=yearData();
  if(!yrSel||!d.some(x=>x.k===yrSel))yrSel=d.some(x=>x.k===S.viewMonth)?S.viewMonth:d[11].k;
  const W=340,H=170,L=36,T=10,B=22,pw=W-L-4,ph=H-T-B,slot=pw/12,bw=Math.min(10,slot*0.36),gap=2;
  const mx=niceMax(Math.max(1,...d.map(x=>Math.max(x.inc,x.exp))));
  const y=v=>T+ph-(v/mx)*ph;
  let g='';
  [0,.5,1].forEach(f=>{const yy=y(mx*f);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${moneyTiny(mx*f)}</text>`});
  let bars='';
  d.forEach((x,i)=>{
    const cx=L+slot*i+slot/2,sel=x.k===yrSel;
    if(sel)bars+=`<rect x="${L+slot*i+1}" y="${T-4}" width="${slot-2}" height="${ph+4}" rx="6" fill="var(--chip)"/>`;
    const hi=ph*(x.inc/mx),he=ph*(x.exp/mx);
    bars+=`<path d="${topBar(cx-bw-gap/2,y(x.inc),bw,hi,4)}" fill="var(--c-inc)"/>`;
    bars+=`<path d="${topBar(cx+gap/2,y(x.exp),bw,he,4)}" fill="var(--c-exp)"/><path d="${topBar(cx+gap/2,y(x.exp),bw,he,4)}" fill="url(#hatch)"/>`;
    const[yy,mm]=x.k.split('-').map(Number);const lbl=new Date(yy,mm-1,1).toLocaleDateString('en-US',{month:'short'});
    bars+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" font-weight="${sel?700:400}" fill="${sel?'var(--ink)':'var(--muted)'}">${mm===1?"'"+String(yy).slice(2):lbl}</text>`;
    bars+=`<rect class="hit" data-ym="${x.k}" x="${L+slot*i}" y="0" width="${slot}" height="${H}" fill="transparent"><title>${monthLabel(x.k)}: income ${money(x.inc)}, expenses ${money(x.exp)}</title></rect>`;
  });
  const base=`<line x1="${L}" x2="${W-4}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>`;
  const s=d.find(x=>x.k===yrSel),net=s.inc-s.exp;
  const ti=d.reduce((a,x)=>a+x.inc,0),te=d.reduce((a,x)=>a+x.exp,0),active=d.filter(x=>x.inc||x.exp).length||1;
  return `<h2 class="sec">Last 12 months</h2><div class="card yr">
    <div class="lg"><span><i style="background:var(--c-inc)"></i>Income</span><span><i style="background:var(--c-exp);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 1.5px,transparent 1.5px 4px)"></i>Expenses</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and expenses by month for the last 12 months">
      <defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="4" fill="rgba(255,255,255,.35)"/></pattern></defs>
      ${g}${bars}${base}
    </svg>
    <div style="font-weight:600;font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">${monthLabel(s.k)}</div><div class="readout" style="border-top:0;margin-top:2px;padding-top:4px"><div class="rv num"><div><span><i class="sw2" style="background:var(--c-inc)"></i>Income</span><b>${money(s.inc)}</b></div><div><span><i class="sw2" style="background:var(--c-exp)"></i>Expenses</span><b>${money(s.exp)}</b></div><div><span>Net</span><b class="${net<0?'neg':''}">${net<0?'−':''}${money(Math.abs(net))}</b></div></div>
      ${s.k!==S.viewMonth?`<button class="btn sm" id="yrOpen">Open ›</button>`:''}</div>
    <div class="ysum num"><div>Income, 12 months<b>${money(ti)}</b></div><div>Spent, 12 months<b>${money(te)}</b></div><div>Net, 12 months<b class="${ti-te<0?'neg':''}">${ti-te<0?'−':''}${money(Math.abs(ti-te))}</b></div><div>Avg spent / month<b>${money(te/active)}</b></div></div>
    <details><summary>Show as table</summary><table><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Net</th></tr>
      ${d.slice().reverse().map(x=>`<tr><td>${monthLabel(x.k)}</td><td>${money(x.inc)}</td><td>${money(x.exp)}</td><td class="${x.inc-x.exp<0?'neg':''}">${x.inc-x.exp<0?'−':''}${money(Math.abs(x.inc-x.exp))}</td></tr>`).join('')}</table></details>
  </div>`;
}
function bindYearChart(){
  $$('.yr .hit').forEach(r=>{
    const pick=()=>{yrSel=r.dataset.ym;const el=$('.yr');const open=el&&el.querySelector('details')?.open;const y=window.scrollY;render();if(open)$('.yr details').open=true;window.scrollTo(0,y)};
    r.addEventListener('click',pick);r.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover)').matches&&yrSel!==r.dataset.ym)pick()});
  });
  const o=$('#yrOpen');if(o)o.onclick=()=>{S.viewMonth=yrSel;syncSelDay();render();window.scrollTo(0,0)};
}

/* ---------- GOALS & ENVELOPES ---------- */
const GOAL_TEMPLATES=[['Emergency fund','🛟',false],['Vacation','✈️',true],['Bills buffer','🧾',false],['Car repairs','🔧',false],['Holidays & gifts','🎄',true],['Fun money','🎉',false]];
const GOAL_EMOJIS=['✈️','🏝️','🛟','🧾','🔧','🔨','🏡','🚗','🎄','🎁','💍','🎓','👶','🐶','💻','🛋️','🏖️','⛷️','🎉','💰','🩺','📦','🛒','💡'];
const goals=()=>S.settings?.goals||[];
const goalById=id=>goals().find(g=>g.id===id);
const hasTarget=g=>(+g.target||0)>0;
function monthsUntil(date){
  if(!date)return null;const[y,m]=date.split('-').map(Number);const n=new Date();
  return Math.max(0,(y-n.getFullYear())*12+(m-1-n.getMonth()));
}
function goalPlan(g){
  const left=Math.max(0,(+g.target||0)-(+g.saved||0));
  const mo=monthsUntil(g.date);
  const k=curMonth();const thisMonth=(g.log||[]).filter(l=>!l.start&&mkey(l.d)===k).reduce((s,l)=>s+l.amt,0);
  const done=hasTarget(g)&&g.saved>=g.target;
  let perMonth=null,msg='';
  if(!hasTarget(g))msg='Envelope';
  else if(done)msg='Goal reached 🎉';
  else if(g.date){
    if(g.date<today())msg=`Target date passed · ${money(left)} to go`;
    else{perMonth=(left+Math.max(0,thisMonth))/Math.max(1,mo);msg=`Save ${money(perMonth)}/month to reach it by ${new Date(g.date+'T12:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`}
  }else msg=`${money(left)} to go`;
  const due=perMonth&&!done?Math.max(0,Math.round((perMonth-thisMonth)*100)/100):0;
  return {left,perMonth,msg,done,thisMonth,mo,due};
}
function saveGoals(list){S.settings.goals=list;saveSettings()}
// Ready to allocate = cash accounts − credit card balances − money already in envelopes
function allocation(){
  const act=accounts();
  const cash=act.filter(isCash).reduce((s,a)=>s+(+a.balance||0),0);
  const cards=act.filter(a=>a.type==='credit').reduce((s,a)=>s+Math.max(0,+a.balance||0),0);
  const env=goals().filter(g=>!g.archived).reduce((s,g)=>s+(+g.saved||0),0);
  const hasCash=act.some(isCash);
  return {cash,cards,env,hasCash,ready:Math.round((cash-cards-env)*100)/100};
}
function readyCardHTML(){
  const A=allocation();
  if(!A.hasCash)return `<div class="card"><p class="label">Ready to allocate</p><p class="hint" style="margin:0">Add your checking, savings or money market accounts on <b>Net Assets</b>. The money in them shows up here so you can give every dollar a job.</p></div>`;
  const neg=A.ready<0;
  return `<div class="card" style="${A.ready>0?'border-color:var(--accent)':neg?'border-color:var(--neg)':''}">
    <p class="label">Ready to allocate</p>
    <div class="serif num big ${neg?'neg':A.ready>0?'pos':''}">${neg?'−':''}${money(Math.abs(A.ready))}</div>
    <p class="hint" style="margin-top:4px">${neg?'You’ve put more into envelopes than you have. Take some out of an envelope to fix it.':A.ready>0?'This money doesn’t have a job yet.':'Every dollar has a job. 👏'}</p>
    <div class="ab num">
      <div><span>Cash in accounts</span><b>${money(A.cash)}</b></div>
      ${A.cards?`<div><span>Set aside for credit cards</span><b>−${money(A.cards)}</b></div>`:''}
      <div><span>In envelopes</span><b>−${money(A.env)}</b></div>
    </div>
    <button class="btn primary" id="allocBtn" style="margin-top:14px">${A.ready>0?'Allocate money':'Move money between envelopes'}</button>
  </div>`;
}
function renderGoals(){
  const gs=goals().filter(g=>!g.archived);
  const withT=gs.filter(hasTarget);
  const tMonthly=withT.reduce((s,g)=>s+(goalPlan(g).perMonth||0),0);
  const tThis=withT.reduce((s,g)=>s+Math.max(0,goalPlan(g).thisMonth),0);
  const card=g=>{
    const p=goalPlan(g),t=hasTarget(g),pct=t?Math.min(100,g.saved/g.target*100):0;
    return `<div class="env ${p.done?'done':''}">
      <div class="flap"></div><div class="seal"></div><div class="stamp" aria-hidden="true">${esc(g.emo)}</div>
      <div class="body" data-g="${g.id}">
        <div class="to">${t?'Saving for':'Envelope'}</div>
        <div class="nm">${esc(g.name)}</div>
        <div class="amt num"><b>${money(g.saved)}</b>${t?`<span class="mut">of ${money(g.target)} · ${Math.round(pct)}%</span>`:''}</div>
        ${t?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}
        ${t?`<div class="sub">${p.done?'<span class="tag ok">Goal reached 🎉</span>':esc(p.msg)}</div>`:''}
        ${p.perMonth&&!p.done?`<div class="sub">${p.due<=0?`<span class="pos">✓ ${money(p.thisMonth)} added this month — on track</span>`:`${money(Math.max(0,p.thisMonth))} added this month · ${money(p.due)} more to stay on track`}</div>`:''}
      </div>
      <div class="acts"><button class="btn sm" data-wd="${g.id}">− Take out</button><button class="btn sm" data-add="${g.id}" style="background:var(--accent);color:var(--on-accent)">+ Add money</button></div>
    </div>`};
  $('#app').innerHTML=banners()+header('Goals','Envelopes')+readyCardHTML()+
  (gs.length?`${tMonthly?`<div class="card" style="padding:12px 16px"><div class="row" style="justify-content:space-between;font-size:13.5px"><span>Goal plans this month</span><b class="num">${money(tMonthly)}</b></div><div class="row" style="justify-content:space-between;font-size:13.5px;margin-top:4px"><span class="mut">Added so far</span><span class="num ${tThis>=tMonthly?'pos':''}">${money(tThis)}</span></div></div>`:''}
    <h2 class="sec">Your envelopes</h2>${gs.map(card).join('')}<button class="btn ghost" id="newGoal">+ New envelope or goal</button>`
  :`<div class="card"><p style="margin:0 0 4px;font-weight:600">Give your money a job</p><p class="hint" style="margin:0 0 14px">Make envelopes for what your cash is for. Give one a target and date to turn it into a savings goal. Pick some to start:</p>
    <div class="tpl">${GOAL_TEMPLATES.map(([n,e,t])=>`<button data-tpl="${esc(n)}" data-e="${e}" data-t="${t?1:0}"><span>${e}</span>${esc(n)}</button>`).join('')}</div>
    <button class="btn ghost" id="newGoal" style="margin-top:10px">+ Make your own</button></div>`);
  $('#newGoal').onclick=()=>openGoalSheet(null);
  const ab=$('#allocBtn');if(ab)ab.onclick=openAllocateSheet;
  $$('[data-tpl]').forEach(b=>b.onclick=()=>openGoalSheet(null,{name:b.dataset.tpl,emo:b.dataset.e,goal:b.dataset.t==='1'}));
  $$('[data-g]').forEach(el=>el.onclick=()=>openGoalSheet(goalById(el.dataset.g)));
  $$('[data-add]').forEach(b=>b.onclick=()=>openMoneySheet(goalById(b.dataset.add),1));
  $$('[data-wd]').forEach(b=>b.onclick=()=>openMoneySheet(goalById(b.dataset.wd),-1));
}
function openAllocateSheet(){
  const gs=goals().filter(g=>!g.archived);
  const A=allocation();
  if(!gs.length){openGoalSheet(null);return}
  const amts={};
  const rows=gs.map(g=>{const p=goalPlan(g);return `<div class="alrow">
    <div class="ge" style="width:38px;height:38px;font-size:19px;border-radius:12px">${esc(g.emo)}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</div>
      <div class="hint num" style="margin:0">${money(g.saved)}${hasTarget(g)?' of '+money(g.target):''}${p.due>0?` · <button class="link" data-plan="${g.id}" data-v="${p.due}">+${money(p.due)} plan</button>`:''}</div></div>
    <input class="inp num" data-al="${g.id}" inputmode="decimal" placeholder="0" style="width:100px;text-align:right">
  </div>`}).join('');
  const hasPlans=gs.some(g=>goalPlan(g).due>0);
  openSheet('Allocate money',`
    <div class="card" style="background:var(--bg);margin:8px 0 6px;padding:12px 14px"><div class="row" style="justify-content:space-between;align-items:baseline"><span class="label" style="margin:0">Left to allocate</span><b class="serif num" id="alLeft" style="font-size:24px"></b></div></div>
    <p class="hint" style="margin:0 0 6px">Type an amount for each envelope. Use a minus sign (−50) to take money out and free it up.</p>
    ${hasPlans?'<button class="btn sm" id="fillPlans" style="width:100%;margin:6px 0 4px">Fill goal plans for this month</button>':''}
    <div>${rows}</div>
    <button class="btn primary" id="alSave">Allocate</button>`,p=>{
    const upd=()=>{
      let sum=0;$$('[data-al]',p).forEach(i=>{const v=parseAmt(i.value);amts[i.dataset.al]=isFinite(v)?v:0;sum+=amts[i.dataset.al]});
      const left=Math.round((A.ready-sum)*100)/100;const el=$('#alLeft',p);
      el.textContent=(left<0?'−':'')+money(Math.abs(left));el.className='serif num '+(left<0?'neg':left>0?'pos':'');
    };
    $$('[data-al]',p).forEach(i=>i.addEventListener('input',upd));
    $$('[data-plan]',p).forEach(b=>b.onclick=()=>{const i=$(`[data-al="${b.dataset.plan}"]`,p);i.value=b.dataset.v;upd()});
    const fp=$('#fillPlans',p);if(fp)fp.onclick=()=>{$$('[data-plan]',p).forEach(b=>{$(`[data-al="${b.dataset.plan}"]`,p).value=b.dataset.v});upd()};
    upd();
    $('#alSave',p).onclick=()=>{
      upd();
      const moves=Object.entries(amts).filter(([,v])=>v);
      if(!moves.length)return toast('Enter an amount for at least one envelope');
      let total=0;
      const list=goals().map(g=>{
        let v=amts[g.id];if(!v)return g;
        if(v<0)v=-Math.min(-v,g.saved);if(!v)return g;
        total+=v;
        return {...g,saved:Math.round((g.saved+v)*100)/100,log:(g.log||[]).concat([{d:today(),amt:v,note:v>0?'Allocated':'Moved out'}])};
      });
      saveGoals(list);closeSheet();
      const r=allocation().ready;
      toast(r<0?`Allocated — now ${money(-r)} over. Take some back out.`:`Allocated ${money(total)} · ${money(r)} left to allocate`);
    };
  });
}
function openGoalSheet(g,preset){
  const isNew=!g;g=g?clone(g):{id:genId(),name:preset?.name||'',emo:preset?.emo||'💰',target:0,saved:0,date:'',log:[],created:Date.now()};
  const log=(g.log||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  const showTarget=!isNew?hasTarget(g):!!preset?.goal;
  openSheet(isNew?'New envelope':`${esc(g.emo)} ${esc(g.name)}`,`
    <label class="field"><span>Name</span><input class="inp" id="gName" value="${esc(g.name)}" placeholder="e.g. Italy trip, Emergency fund"></label>
    <div class="field"><span>Icon</span><div class="emo-pick">${GOAL_EMOJIS.map(e=>`<button type="button" class="${e===g.emo?'on':''}" data-e="${e}">${e}</button>`).join('')}</div></div>
    <label class="toggle"><input type="checkbox" id="gHasT" ${showTarget?'checked':''}><span><b>Saving toward a target</b><br><span class="hint">Turn on to set an amount and date. The app works out what to put in each month.</span></span></label>
    <div id="gTWrap" style="${showTarget?'':'display:none'}"><div class="row"><label class="field"><span>Target amount</span><input class="inp num" id="gTarget" inputmode="decimal" value="${g.target||''}" placeholder="5,000"></label>
    <label class="field"><span>Target date (optional)</span><input type="date" class="inp" id="gDate" value="${g.date||''}"></label></div></div>
    ${isNew?`<label class="field"><span>Put in now (optional)</span><input class="inp num" id="gSaved" inputmode="decimal" placeholder="0.00"></label><p class="hint">Comes out of Ready to allocate (${money(allocation().ready)}).</p>`:''}
    <div id="gCalc" class="hint" style="min-height:18px;margin-top:10px"></div>
    <button class="btn primary" id="gSave">${isNew?'Create':'Save'}</button>
    ${!isNew?`${log.length?`<h2 class="sec">History</h2><div class="list">${log.map(l=>`<div class="it" style="cursor:default"><div class="ic">${l.amt>0?'＋':'−'}</div><div class="mid"><div class="t">${l.amt>0?'Added':'Took out'}</div><div class="s">${dayLabel(l.d)}${l.note?' · '+esc(l.note):''}</div></div><div class="amt num ${l.amt>0?'pos':'neg'}">${l.amt>0?'+':'−'}${money(Math.abs(l.amt))}</div></div>`).join('')}</div>`:''}
      <button class="btn danger" id="gDel" style="width:100%;margin-top:16px">Delete envelope</button><p class="hint">Any money in it goes back to Ready to allocate.</p>`:''}`,p=>{
    $$('[data-e]',p).forEach(b=>b.onclick=()=>{g.emo=b.dataset.e;$$('[data-e]',p).forEach(x=>x.classList.toggle('on',x===b))});
    const ht=$('#gHasT',p);
    const calc=()=>{const t=parseAmt($('#gTarget',p).value),d=$('#gDate',p).value,sv=isNew?(parseAmt($('#gSaved',p).value)||0):g.saved;
      if(ht.checked&&t>0&&d&&d>today()){const mo=Math.max(1,monthsUntil(d));$('#gCalc',p).innerHTML=`That's about <b>${money(Math.max(0,t-sv)/mo)}/month</b> for ${mo} month${mo>1?'s':''}.`}else $('#gCalc',p).innerHTML=''};
    ht.onchange=()=>{$('#gTWrap',p).style.display=ht.checked?'':'none';calc()};
    ['#gTarget','#gDate','#gSaved'].forEach(s=>{const el=$(s,p);el&&el.addEventListener('input',calc)});calc();
    $('#gSave',p).onclick=()=>{
      g.name=$('#gName',p).value.trim();if(!g.name)return toast('Give it a name');
      if(ht.checked){const t=parseAmt($('#gTarget',p).value);if(!(t>0))return toast('Enter a target amount');g.target=t;g.date=$('#gDate',p).value||''}
      else{g.target=0;g.date=''}
      if(isNew){const sv=parseAmt($('#gSaved',p).value);if(sv>0){g.saved=sv;g.log=[{d:today(),amt:sv,note:'Starting amount',start:true}]}}
      const list=goals().slice();if(isNew)list.push(g);else list.splice(list.findIndex(x=>x.id===g.id),1,g);
      saveGoals(list);closeSheet();toast(isNew?`${g.name} created`:'Saved');
    };
    const d=$('#gDel',p);if(d){let armed=false;d.onclick=()=>{if(!armed){armed=true;d.textContent='Tap again to delete';return}saveGoals(goals().filter(x=>x.id!==g.id));closeSheet();toast('Deleted')}}
    if(isNew&&!g.name)setTimeout(()=>$('#gName',p).focus(),50);
  });
}
function openMoneySheet(g,sign){
  const ready=allocation().ready;
  openSheet(sign>0?`Add to ${esc(g.name)}`:`Take out of ${esc(g.name)}`,`
    <div class="amount-wrap"><span class="cur serif">$</span><input id="mAmt" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Amount"></div>
    <div id="mAfter" class="hint" style="text-align:center;min-height:18px"></div>
    ${sign>0&&ready>0?`<div style="text-align:center"><button class="link" id="mAll">Use all ${money(ready)} ready to allocate</button></div>`:''}
    <label class="field"><span>Date</span><input type="date" class="inp" id="mDate" value="${today()}"></label>
    <label class="field"><span>Note (optional)</span><input class="inp" id="mNote" placeholder="${sign>0?'e.g. From paycheck':'e.g. Booked flights'}"></label>
    <p class="hint">${sign>0?'Comes out of Ready to allocate.':'Goes back to Ready to allocate. If you spent it, also enter the expense so your account balance drops.'}</p>
    <button class="btn primary" id="mSave">${sign>0?'Add money':'Take out'}</button>`,p=>{
    const a=$('#mAmt',p);
    const after=()=>{const v=parseAmt(a.value);if(v>0){const ns=Math.max(0,g.saved+sign*v),r=ready-sign*Math.min(v,sign<0?g.saved:v);
      $('#mAfter',p).innerHTML=`${esc(g.name)}: ${money(ns)}${hasTarget(g)?` of ${money(g.target)}`:''} · Ready to allocate: <span class="${r<0?'neg':''}">${r<0?'−':''}${money(Math.abs(r))}</span>`}else $('#mAfter',p).innerHTML=''};
    a.addEventListener('input',after);
    const all=$('#mAll',p);if(all)all.onclick=()=>{a.value=ready;after()};
    a.addEventListener('keydown',e=>{if(e.key==='Enter')$('#mSave',p).click()});
    $('#mSave',p).onclick=()=>{
      let v=parseAmt(a.value);if(!(v>0))return toast('Enter an amount');
      if(sign<0)v=Math.min(v,g.saved);
      const ng=clone(g);ng.saved=Math.round((ng.saved+sign*v)*100)/100;ng.log=(ng.log||[]).concat([{d:$('#mDate',p).value||today(),amt:sign*v,note:$('#mNote',p).value.trim()}]);
      const wasDone=hasTarget(g)&&g.saved>=g.target;
      saveGoals(goals().map(x=>x.id===g.id?ng:x));closeSheet();
      toast(hasTarget(ng)&&!wasDone&&ng.saved>=ng.target?`🎉 ${ng.name} goal reached!`:sign>0?`Added ${money(v)} to ${ng.name}`:`Took ${money(v)} out of ${ng.name}`);
    };
    setTimeout(()=>a.focus(),50);
  });
}

/* ---------- boot ---------- */
{const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;}
init();
</script>
